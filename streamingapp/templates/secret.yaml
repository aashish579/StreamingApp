{{- $existing := lookup "v1" "Secret" .Release.Namespace "streamingapp-secret" -}}
{{- $data := dict -}}
{{- $fields := dict
  "JWT_SECRET" .Values.secrets.jwtSecret
  "AWS_ACCESS_KEY_ID" .Values.secrets.awsAccessKeyId
  "AWS_SECRET_ACCESS_KEY" .Values.secrets.awsSecretAccessKey
  "AWS_SESSION_TOKEN" .Values.secrets.awsSessionToken
  "AWS_S3_BUCKET" .Values.secrets.awsS3Bucket
-}}
{{- range $key, $value := $fields }}
  {{- if and $value (ne $value "replace-before-demo") }}
    {{- $_ := set $data $key ($value | toString | b64enc) }}
  {{- else if $existing }}
    {{- $old := index $existing.data $key }}
    {{- if $old }}
      {{- $_ := set $data $key $old }}
    {{- end }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: streamingapp-secret
type: Opaque
data:
{{- toYaml $data | nindent 2 }}
