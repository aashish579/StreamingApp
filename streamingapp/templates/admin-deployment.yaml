apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
spec:
  replicas: {{ .Values.services.admin.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:

      {{- with .Values.aws }}
      {{- if .irsaEnabled }}
      serviceAccountName: {{ .serviceAccountName | quote }}
      {{- end }}
      {{- end }}
      containers:
        - name: admin
          image: "{{ .Values.services.admin.image }}:{{ .Values.services.admin.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.services.admin.port }}
          env:
            - name: PORT
              value: {{ .Values.services.admin.port | quote }}
            - name: MONGO_URI
              value: "mongodb://mongo:{{ .Values.mongo.port }}/{{ .Values.mongo.database }}"
          envFrom:
            - configMapRef:
                name: streamingapp-config
            - secretRef:
                name: streamingapp-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.services.admin.port }}
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.services.admin.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources.backend | indent 12 }}
